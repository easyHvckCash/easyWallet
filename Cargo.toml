[package]
name = "btc-cuda-scanner"
version = "0.3.0"
edition = "2021"
description = "BIP39 mnemonic scanner - Full GPU Pipeline (secp256k1+BinaryFuse8 on CUDA) + Double-Buffer"

[dependencies]
base64 = "0.22"
bip39 = "2"
bitcoin = { version = "0.32", features = ["secp-recovery"] }
bs58 = "0.5"
secp256k1 = "0.29"
sha2 = "0.10"
hmac = "0.12"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
xorf = "0.12"
siphasher = "1"
sysinfo = "0.31"
rand = "0.8"
cudarc = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "cuda-version-from-build-system", "fallback-dynamic-loading"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
